    <meta charset="UTF-8" />
    <script>
      // Polyfill/shim window.fetch setter in environments where Window.fetch only defines a getter
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if object is non-configurable
        }
      })();
    </script>
